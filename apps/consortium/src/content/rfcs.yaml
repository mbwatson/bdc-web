  url: https://docs.google.com/document/d/1m78tCB8cgV3cAbGyIUx4c8C9SV3X9rqkUdv5oTH-G9g/edit?usp=sharing
  description: 'The DataSTAGE Coordinating Center (STAGECC) is circulating, for informational purposes, the DataSTAGE User Narratives for delivery & completion by June 2019. This STAGE-RFC provides a means
    of transparency and documentation of strategic planning process and outcomes for the DataSTAGE Consortium, pursuant to the RFC process established by the Consortium. STAGE-RFC-1: DataSTAGE User Narratives
    June 2019 describes agreement among participants in the STAGE Consortium on the User Narratives that will be addressed by June 2019. The purpose of the RFC is to formalize and circulate this agreement
    to all stakeholders DataSTAGE program. Subsequent RFCs will be released to capture agreement on later collections of User Narratives.'
