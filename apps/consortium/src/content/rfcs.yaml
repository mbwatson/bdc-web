  title: 'STAGE-DRAFT-1: DataSTAGE Strategic Planning Decisions 2019-2021'
  description: The Strategic Planning Decisions (STAGE-DRAFT-1) describes decisions made as a result of a small-group Strategic Planning meeting held in Bethesda, MD, on January 10, 2019. The purpose of
    the meeting was to create the framework for STAGE Consortium to work together in common understanding to execute the mission and vision of the DataSTAGE program. Participants of the meeting included
    NHLBI staff (Jon Kaltman, Alastair Thomson, Chip Schwartz, Jeffrey Snyder, Katie O’Sullivan), STAGE Steering Committee Chair (Ingrid Borecki), and representatives of STAGE Coordinating Center (Stan
    Ahalt, Rebecca Boyles, Asia Mieczkowska). This document will continue to reflect action items and decisions made at the Consortium Leadership and Coordination Center level. Action Items and Decisions
    are located within the STAGE Consortium Action Items and Decisions Log document.
