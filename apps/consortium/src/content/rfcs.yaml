- id: stage-rfc-3
  phase: rfc
  status: open
  title: 'STAGE-RFC-3: Data Harmonization Working Group Workshop Report'
  url: https://docs.google.com/document/d/1DZ38Hy4ZuwCZ3tiFr7YcYRVup3qma7lTV_zgBnKEysc/edit?usp=sharing
  description: 'The Data Harmonization Working Group''s Workshop in March of 2019 at the STAGE face to face meeting was both a critical and successful event. For the first time, the different groups within
    STAGE that have been working on the data in different ways came together to define key functional goals, to plan technical integration of different data, and to create pivotal synergies that will help
    realize the vision for STAGE. Key goals included: data model harmonization; data harmonization and developing new strategies for both retrospective and prospective CDE/phenotype harmonization; STAGE
    functional requirements, with a specific focus on semantic integration and technologies for search and discovery; and the use of these foundations for the instantiation of an AI-driven user narrative,
    that will be submitted via the standard procedure. This document is meant to communicate the results of the workshop to all stakeholders. Further refinement of the requirements and action items will
    take place in a standard software development environment such as GitHub.'
