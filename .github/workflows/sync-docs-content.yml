name: Sync Docs

on:
  repository_dispatch:
    types: [gitbook-content-updated]
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-content-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync from GitBook content repo
    runs-on: ubuntu-latest
    env:
      CONTENT_REPO: stagecc/bdc-gitbook
      CONTENT_SOURCE_PATH: .
      DOCS_TARGET_PATH: apps/docs/src/content/docs
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}
          path: .tmp/content
          fetch-depth: 1

      - name: Sync content files
        id: sync
        run: |
          SOURCE_DIR=".tmp/content/${CONTENT_SOURCE_PATH}"
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Expected content source path '$SOURCE_DIR' does not exist."
            echo "Set CONTENT_SOURCE_PATH to the correct directory in ${CONTENT_REPO}."
            exit 1
          fi

          rsync -av --delete "${SOURCE_DIR}/" "${DOCS_TARGET_PATH}/"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const docsRoot = process.env.DOCS_TARGET_PATH;

          const toTitleCase = (value) =>
            value
              .split(/\s+/)
              .filter(Boolean)
              .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
              .join(' ');

          const walkFiles = (dir, out = []) => {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkFiles(fullPath, out);
              } else if (/\.(md|mdx)$/i.test(entry.name)) {
                out.push(fullPath);
              }
            }
            return out;
          };

          const markdownFiles = walkFiles(docsRoot);
          let renamedCount = 0;
          let frontmatterAddedCount = 0;
          let titleBackfilledCount = 0;

          const inferTitle = (filePath, source) => {
            const headingMatch = source.match(/^#\s+(.+)$/m);
            const rawName = path.basename(filePath, path.extname(filePath));
            const fallback =
              rawName.toLowerCase() === 'index'
                ? path.basename(path.dirname(filePath))
                : rawName;
            return (headingMatch?.[1] || toTitleCase(fallback.replace(/[-_]+/g, ' '))).trim();
          };

          for (const filePath of markdownFiles) {
            const fileName = path.basename(filePath).toLowerCase();
            if (fileName !== 'readme.md' && fileName !== 'readme.mdx') continue;

            const ext = path.extname(filePath);
            const indexPath = path.join(path.dirname(filePath), `index${ext}`);
            if (!fs.existsSync(indexPath)) {
              fs.renameSync(filePath, indexPath);
              renamedCount += 1;
            }
          }

          const normalizedFiles = walkFiles(docsRoot);
          const frontmatterRegex = /^---\s*\n([\s\S]*?)\n---\s*(\n|$)/;

          for (const filePath of normalizedFiles) {
            const source = fs.readFileSync(filePath, 'utf8');
            const frontmatterMatch = source.match(frontmatterRegex);
            const title = inferTitle(filePath, source);

            if (!frontmatterMatch) {
              const frontmatter = `---\ntitle: ${JSON.stringify(title)}\n---\n\n`;
              fs.writeFileSync(filePath, `${frontmatter}${source}`);
              frontmatterAddedCount += 1;
              continue;
            }

            const existingFrontmatter = frontmatterMatch[1] || '';
            if (/(^|\n)title\s*:/.test(existingFrontmatter)) continue;

            const existingBody = source.slice(frontmatterMatch[0].length);
            const normalizedFrontmatter = existingFrontmatter.trimEnd();
            const updatedFrontmatter = normalizedFrontmatter
              ? `${normalizedFrontmatter}\ntitle: ${JSON.stringify(title)}`
              : `title: ${JSON.stringify(title)}`;

            fs.writeFileSync(filePath, `---\n${updatedFrontmatter}\n---\n\n${existingBody}`);
            titleBackfilledCount += 1;
          }

          console.log(`Renamed ${renamedCount} README files to index.*`);
          console.log(`Added frontmatter to ${frontmatterAddedCount} markdown files`);
          console.log(`Backfilled missing title in ${titleBackfilledCount} markdown files`);
          NODE

          if git diff --quiet -- "${DOCS_TARGET_PATH}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci

      - name: Build docs
        if: steps.sync.outputs.changed == 'true'
        run: npm run build -w @bdc/docs

      - name: Create pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/docs-content-sync
          delete-branch: true
          commit-message: "chore(docs): sync GitBook content"
          title: "chore(docs): sync GitBook content"
          body: |
            Automated sync from `stagecc/bdc-gitbook` into `apps/docs/src/content/docs`.
          labels: |
            docs
            automated
          add-paths: |
            apps/docs/src/content/docs
