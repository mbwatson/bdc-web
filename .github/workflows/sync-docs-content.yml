name: Sync Docs

on:
  repository_dispatch:
    types: [gitbook-content-updated]
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-content-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync from GitBook content repo
    runs-on: ubuntu-latest
    env:
      CONTENT_REPO: stagecc/bdc-gitbook
      CONTENT_SOURCE_PATH: docs
      DOCS_TARGET_PATH: apps/docs/src/content/docs
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}
          path: .tmp/content
          fetch-depth: 1

      - name: Sync content files
        id: sync
        run: |
          rsync -av --delete ".tmp/content/${CONTENT_SOURCE_PATH}/" "${DOCS_TARGET_PATH}/"

          if git diff --quiet -- "${DOCS_TARGET_PATH}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci

      - name: Build docs
        if: steps.sync.outputs.changed == 'true'
        run: npm run build -w @bdc/docs

      - name: Create pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/docs-content-sync
          delete-branch: true
          commit-message: "chore(docs): sync GitBook content"
          title: "chore(docs): sync GitBook content"
          body: |
            Automated sync from `stagecc/bdc-gitbook` into `apps/docs/src/content/docs`.
          labels: |
            docs
            automated
          add-paths: |
            apps/docs/src/content/docs
